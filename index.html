<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#070a10" />
  <title>Mine Exploration: Chapter 1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="600" height="800"></canvas>

    <!-- ===================== 开始界面 ===================== -->
    <div class="overlay" id="startScreen">
      <div class="panel">
        <p class="eyebrow">Identity V &middot; Gold Miner</p>
        <h1 class="title">Mine Exploration</h1>
        <button class="btn btn-primary" id="startBtn" type="button">Start Challenge</button>
        <p class="footnote">
          Launch your pickaxe within the time limit and mine as many high-value treasures as
          possible.
        </p>
      </div>
    </div>

    <!-- ===================== 结算界面（第一关胜负分支 / 第二关终极结算） ===================== -->
    <div class="overlay is-hidden" id="overScreen">
      <div class="panel">
        <p class="eyebrow" id="overEyebrow">Shift Complete</p>
        <h2 class="title title-sm" id="overTitle">Time's Up!</h2>
        <p class="result">Total Treasure Value: <span id="overScore">0</span></p>
        <p class="result result-sub" id="overDetail">Target 1,000</p>
        <p class="footnote" id="overNote">
          Take a screenshot and share your success through the button below.
        </p>
        <div class="btn-row">
          <a
            class="btn btn-share"
            id="shareBtn"
            href="https://discord.gg/placeholder"
            target="_blank"
            rel="noopener noreferrer"
            hidden
          >Share to Discord</a>
          <button class="btn btn-primary" id="retryBtn" type="button" hidden>Try Again</button>
          <button class="btn btn-primary" id="nextBtn" type="button" hidden>Next Chapter</button>
          <button class="btn btn-primary" id="againBtn" type="button" hidden>Play Again</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
